<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMAH MD - Pairing Portal</title>
    <link rel="icon" href="/assets/logo.png">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #2a1204 0%, #05070a 65%);
            color: #fff7ed;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
            overflow-x: hidden;
        }
        .card {
            position: relative;
            background: rgba(10, 8, 6, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 50px rgba(249,115,22,0.25);
            width: 380px;
            max-width: 100%;
            text-align: center;
            border: 1px solid rgba(249,115,22,0.35);
        }
        .logo-wrap {
            width: 110px; height: 110px; margin: 0 auto 14px auto;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, #f97316, #facc15, #f59e0b, #f97316);
            animation: spin 6s linear infinite;
        }
        .logo-inner {
            width: 100%; height: 100%; border-radius: 50%;
            background: #0b0603; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .logo-inner img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 {
            color: #fb923c; margin: 4px 0 4px 0; font-size: 27px; letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(249,115,22,0.6);
        }
        .badge {
            display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #1c0a00;
            background: linear-gradient(135deg,#facc15,#f97316);
            padding: 4px 12px; border-radius: 20px; font-weight: bold; margin-bottom: 14px; letter-spacing: 0.5px;
        }
        .badge svg { width: 12px; height: 12px; flex-shrink: 0; }
        p { color: #d6b7a3; font-size: 14px; margin-bottom: 20px; }
        .input-wrap { position: relative; }
        .input-wrap svg {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; stroke: #c2916e; pointer-events: none;
        }
        input {
            width: 100%; padding: 14px 14px 14px 42px; margin: 10px 0 20px 0;
            border: 1px solid #4a2a15; border-radius: 10px;
            background: #170d07; color: #fff; font-size: 16px;
            outline: none; transition: 0.25s;
        }
        input:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.25); }
        button {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #1c0a00; border: none; padding: 14px; width: 100%;
            border-radius: 10px; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.25s; letter-spacing: 0.3px;
        }
        button svg { width: 18px; height: 18px; }
        button:hover:not(:disabled) { opacity: 0.92; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(249,115,22,0.45); }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        #result { margin-top: 20px; font-size: 15px; word-break: break-all; font-weight: bold; min-height: 20px; }
        #result .code-box {
            font-size: 26px; color: #facc15; background: #170d07; padding: 10px 20px;
            border-radius: 8px; display: inline-block; border: 1px dashed #facc15; letter-spacing: 2px;
        }
        #result .hint { display: block; font-size: 12px; color: #d6b7a3; font-weight: normal; margin-top: 10px; }
        #result .err { display: inline-flex; align-items: center; gap: 6px; color: #f87171; }
        #result .err svg { width: 16px; height: 16px; flex-shrink: 0; }
        .footer { margin-top: 22px; font-size: 11px; color: #7a5a44; }
        .status-line { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #d6b7a3; margin-top: 10px; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #64748b;
        }
        .status-dot.online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .status-dot.offline { background: #f87171; box-shadow: 0 0 8px #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap"><div class="logo-inner"><img src="/assets/logo.png" alt="NIMAH MD logo"></div></div>
        <span class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg>
            100+ COMMANDS
        </span>
        <h2>NIMAH MD</h2>
        <p>Enter your WhatsApp number with country code to get your pair code</p>
        <form id="pairForm">
            <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <input type="text" id="phone" placeholder="e.g. 94771234567" required>
            </div>
            <button type="submit" id="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <span id="btnText">Get Pair Code</span>
            </button>
        </form>
        <div id="result"></div>
        <div class="status-line">
            <span class="status-dot" id="statusDot"></span><span id="statusText">Checking status...</span>
        </div>
        <div class="footer">Powered by NIMAH MD — Multi-Device</div>
    </div>
    <script>
        // Lightweight in-browser sound design (no external audio files needed)
        let audioCtx = null;
        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }
        function tone(freq, duration, delay, type, gainPeak) {
            try {
                const ctx = getCtx();
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(gainPeak || 0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
                    osc.connect(gain).connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration / 1000);
                }, delay || 0);
            } catch (e) {}
        }
        function playClick() { tone(520, 70, 0, 'sine', 0.06); }
        function playSuccess() {
            tone(523, 110, 0, 'triangle', 0.07);
            tone(659, 110, 100, 'triangle', 0.07);
            tone(784, 140, 200, 'triangle', 0.08);
            tone(1046, 220, 340, 'triangle', 0.08);
        }
        function playError() { tone(300, 160, 0, 'sawtooth', 0.05); tone(180, 240, 130, 'sawtooth', 0.05); }

        function iconError() {
            return '<span class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
        }

        document.getElementById('pairForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            playClick();
            const phone = document.getElementById('phone').value;
            const btn = document.getElementById('btn');
            const btnText = document.getElementById('btnText');
            const result = document.getElementById('result');
            btn.disabled = true;
            btnText.innerText = 'Generating...';
            result.innerHTML = '';
            try {
                const res = await fetch('/code?phone=' + encodeURIComponent(phone));
                const data = await res.json();
                if (data.code) {
                    result.innerHTML = '<span class="code-box">' + data.code + '</span>' +
                        '<span class="hint">Enter this in WhatsApp → Linked Devices → Link with phone number. Status below updates automatically.</span>';
                    btnText.innerText = 'Code Ready';
                    playSuccess();
                    pollStatus(true);
                } else {
                    result.innerHTML = iconError() + (data.error || 'Failed to generate') + '</span>';
                    btnText.innerText = 'Get Pair Code';
                    btn.disabled = false;
                    playError();
                }
            } catch (err) {
                result.innerHTML = iconError() + 'Server connection error</span>';
                btnText.innerText = 'Get Pair Code';
                btn.disabled = false;
                playError();
            }
        });

        let statusInterval = null;
        async function checkStatus() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                if (data.connected) {
                    dot.className = 'status-dot online';
                    text.innerText = 'Bot Connected';
                    if (statusInterval) { clearInterval(statusInterval); statusInterval = null; }
                } else {
                    dot.className = 'status-dot offline';
                    text.innerText = 'Waiting for connection...';
                }
            } catch (e) {
                document.getElementById('statusText').innerText = 'Status unavailable';
            }
        }
        function pollStatus(fast) {
            checkStatus();
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(checkStatus, fast ? 3000 : 8000);
        }
        pollStatus(false);
    </script>
</body>
</html>
